name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Typecheck
        id: npm-typecheck
        run: npm run typecheck

      - name: Test
        id: npm-test
        run: npm run test

  test-action:
    name: Action Bootstrap (${{ matrix.os }}, ${{ matrix.bootstrap }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        bootstrap: [install, reuse]
    env:
      BOOTSTRAP_SCENARIO: ${{ matrix.bootstrap }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Create TRX file
        shell: bash
        run: |
          mkdir -p TestResults
          cat > TestResults/comprehensive.trx << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <TestRun id="a1b2c3d4-e5f6-7890-abcd-ef1234567890" name="Test Run" xmlns="http://microsoft.com/schemas/VisualStudio/TeamTest/2010">
            <TestDefinitions>
              <UnitTest name="PassedTest" id="11111111-1111-1111-1111-111111111111">
                <TestMethod className="MyTests.Tests" name="PassedTest" />
              </UnitTest>
              <UnitTest name="FailedTest" id="22222222-2222-2222-2222-222222222222">
                <TestMethod className="MyTests.Tests" name="FailedTest" />
              </UnitTest>
            </TestDefinitions>
            <TestEntries>
              <TestEntry testId="11111111-1111-1111-1111-111111111111" testListId="19431567-8539-422a-85d7-44ee4e166bda" executionId="aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" />
              <TestEntry testId="22222222-2222-2222-2222-222222222222" testListId="19431567-8539-422a-85d7-44ee4e166bda" executionId="bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb" />
            </TestEntries>
            <TestLists>
              <TestList name="Results Not in a List" id="19431567-8539-422a-85d7-44ee4e166bda" />
            </TestLists>
            <Results>
              <UnitTestResult executionId="aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" testId="11111111-1111-1111-1111-111111111111" testName="PassedTest" outcome="Passed" />
              <UnitTestResult executionId="bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb" testId="22222222-2222-2222-2222-222222222222" testName="FailedTest" outcome="Failed" />
            </Results>
          </TestRun>
          EOF

      - name: Prepare side-by-side SDK fixture
        if: matrix.bootstrap == 'reuse'
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Isolate bootstrap and verify starting conditions
        run: node .github/scripts/test-bootstrap.mjs prepare

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          trx-file-path: './TestResults/comprehensive.trx'
          artifact-name: test-results-${{ matrix.os }}-${{ matrix.bootstrap }}

      - name: Verify Action Outputs
        env:
          PLAYLIST_PATH: ${{ steps.test-action.outputs.playlist-path }}
          ARTIFACT_DIR: ${{ steps.test-action.outputs.artifact-dir }}
        run: node .github/scripts/test-bootstrap.mjs verify

      - name: Download uploaded playlist
        uses: actions/download-artifact@v8
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.bootstrap }}
          path: downloaded-playlists

      - name: Verify uploaded playlist contents
        run: node .github/scripts/test-bootstrap.mjs artifact

      - name: Test with converter already on PATH
        uses: ./
        with:
          trx-file-path: './TestResults/comprehensive.trx'
          artifact-name: test-results-${{ matrix.os }}-${{ matrix.bootstrap }}-reuse-tool

      - name: Test bundled cleanup
        env:
          STATE_toolPath: ${{ runner.temp }}/.dotnet-tools-trx-to-vsplaylist
        run: node dist/post.js

      - name: Verify cleanup
        run: node .github/scripts/test-bootstrap.mjs cleanup
